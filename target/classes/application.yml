spring:
  security:
    user:
      name: ${ADMIN_USER:keval}
      password: ${ADMIN_PASS:LOCKDOWN_ACTIVE_NO_PASSWORD_SET_1a2b3c}
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:h2:mem:telestock;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:8080}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_API_MODEL:gemini-2.5-flash}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
  chat:
    id: ${TELEGRAM_CHAT_ID:}
