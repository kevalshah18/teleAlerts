spring:
  security:
    user:
      name: ${ADMIN_USER:keval}
      password: ${ADMIN_PASS:LOCKDOWN_ACTIVE_NO_PASSWORD_SET_1a2b3c}
  main:
    allow-circular-references: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/telestock}}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:8080}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_API_MODEL:gemini-1.5-flash}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
  chat:
    id: ${TELEGRAM_CHAT_ID:}
